<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Narishakti-Safety | Single-File Standalone Safety App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .sos-glow { box-shadow: 0 0 50px rgba(225, 29, 72, 0.6), 0 0 20px rgba(244, 63, 94, 0.4); }
    .sos-ring { animation: sos-ring-anim 2s infinite ease-out; }
    @keyframes sos-ring-anim {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 30px rgba(225, 29, 72, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }
    .strobe-screen { animation: strobe-flash 0.12s infinite; }
    @keyframes strobe-flash {
      0%, 49% { background-color: #ffffff; color: #000000; }
      50%, 100% { background-color: #000000; color: #ffffff; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Web Audio Synthesizer ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.sirenOsc = null;
        this.sirenMod = null;
        this.sirenGain = null;
        this.isSirenPlaying = false;
        this.ringInterval = null;
      }
      getCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      startSiren() {
        if (this.isSirenPlaying) return;
        const ctx = this.getCtx();
        if (!ctx) return;
        this.sirenGain = ctx.createGain();
        this.sirenGain.gain.setValueAtTime(0.7, ctx.currentTime);
        this.sirenOsc = ctx.createOscillator();
        this.sirenOsc.type = 'sawtooth';
        this.sirenOsc.frequency.setValueAtTime(800, ctx.currentTime);
        this.sirenMod = ctx.createOscillator();
        this.sirenMod.type = 'sine';
        this.sirenMod.frequency.setValueAtTime(2, ctx.currentTime);
        const modGain = ctx.createGain();
        modGain.gain.setValueAtTime(450, ctx.currentTime);
        this.sirenMod.connect(modGain);
        modGain.connect(this.sirenOsc.frequency);
        this.sirenOsc.connect(this.sirenGain);
        this.sirenGain.connect(ctx.destination);
        this.sirenMod.start();
        this.sirenOsc.start();
        this.isSirenPlaying = true;
      }
      stopSiren() {
        if (!this.isSirenPlaying) return;
        try {
          if (this.sirenOsc) { this.sirenOsc.stop(); this.sirenOsc.disconnect(); }
          if (this.sirenMod) { this.sirenMod.stop(); this.sirenMod.disconnect(); }
        } catch(e){}
        this.isSirenPlaying = false;
      }
      startRingtone() {
        this.stopRingtone();
        const play = () => {
          const ctx = this.getCtx();
          if (!ctx) return;
          const o1 = ctx.createOscillator();
          const o2 = ctx.createOscillator();
          const g = ctx.createGain();
          o1.frequency.setValueAtTime(440, ctx.currentTime);
          o2.frequency.setValueAtTime(480, ctx.currentTime);
          g.gain.setValueAtTime(0.3, ctx.currentTime);
          g.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 1.8);
          o1.connect(g); o2.connect(g); g.connect(ctx.destination);
          o1.start(); o2.start(); o1.stop(ctx.currentTime + 1.8); o2.stop(ctx.currentTime + 1.8);
        };
        play();
        this.ringInterval = setInterval(play, 3500);
      }
      stopRingtone() {
        if (this.ringInterval) clearInterval(this.ringInterval);
      }
      speakFakeCall() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance("Hey, where are you? It's your brother. I'm outside with the car waiting for you. Come out now and walk straight to me. I'm right here with you.");
          u.lang = 'en-IN';
          u.rate = 0.92;
          u.pitch = 1;
          u.volume = 1;
          window.speechSynthesis.speak(u);
        }
      }
      stopSpeech() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }
    const sounds = new SoundManager();

    // --- Main App Component ---
    function App() {
      // Coordinates default to Nagpur 440024
      const [location, setLocation] = useState({
        lat: 21.0856,
        lng: 79.0241,
        address: 'PIN 440024, Nagpur, Maharashtra',
      });
      const [masterPin, setMasterPin] = useState('1234');
      const [sosOpen, setSosOpen] = useState(false);
      const [countdown, setCountdown] = useState(5);
      const [isCounting, setIsCounting] = useState(false);
      const [isSosTriggered, setIsSosTriggered] = useState(false);
      const [sirenActive, setSirenActive] = useState(false);
      const [decoyActive, setDecoyActive] = useState(false);
      const [calcDisplay, setCalcDisplay] = useState('0');
      const [fakeCallOpen, setFakeCallOpen] = useState(false);
      const [callAnswered, setCallAnswered] = useState(false);
      const [callSecs, setCallSecs] = useState(0);
      const [activeTab, setActiveTab] = useState('home');

      // Zip Code Search
      const [zipQuery, setZipQuery] = useState('');
      const [zipLoading, setZipLoading] = useState(false);
      const [zipFeedback, setZipFeedback] = useState('');

      // Map reference
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const markersGroup = useRef(null);

      // Escape key triggers disguise
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape') setDecoyActive(prev => !prev);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      // Fake Call Timer
      useEffect(() => {
        let t;
        if (fakeCallOpen && callAnswered) {
          t = setInterval(() => setCallSecs(s => s + 1), 1000);
        } else {
          setCallSecs(0);
        }
        return () => clearInterval(t);
      }, [fakeCallOpen, callAnswered]);

      // Initialize Leaflet Map
      useEffect(() => {
        if (activeTab === 'map' && mapRef.current && window.L && !mapInstance.current) {
          const map = L.map(mapRef.current).setView([location.lat, location.lng], 15);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          mapInstance.current = map;
          markersGroup.current = L.layerGroup().addTo(map);
        }
        if (mapInstance.current && markersGroup.current) {
          mapInstance.current.setView([location.lat, location.lng], 15);
          markersGroup.current.clearLayers();
          
          // User marker
          L.circleMarker([location.lat, location.lng], {
            radius: 9, fillColor: '#f43f5e', color: '#fff', weight: 3, fillOpacity: 1
          }).addTo(markersGroup.current).bindPopup(`<b>Your Active Location</b><br>${location.address}`);

          // Nearby Nagpur 440024 Safe Havens
          const havens = [
            { name: "Nagpur Police Station & Bharosa Cell", lat: location.lat + 0.0035, lng: location.lng + 0.0028, phone: "112 / 0712-2561100", type: "Police" },
            { name: "Mayo / GMCH Civil Hospital 24/7 ER", lat: location.lat - 0.0042, lng: location.lng + 0.0031, phone: "108", type: "Hospital" },
            { name: "24-Hour Verified Medical Store", lat: location.lat + 0.0018, lng: location.lng - 0.0039, phone: "1091", type: "Pharmacy" }
          ];
          havens.forEach(h => {
            L.circleMarker([h.lat, h.lng], {
              radius: 8, fillColor: h.type === 'Police' ? '#3b82f6' : '#10b981', color: '#fff', weight: 2, fillOpacity: 1
            }).addTo(markersGroup.current).bindPopup(`<b>${h.name}</b><br>Phone: ${h.phone}`);
          });
        }
      }, [activeTab, location]);

      // Handle SOS Countdown
      const triggerSos = () => {
        setSosOpen(true);
        setIsCounting(true);
        setCountdown(5);
        setIsSosTriggered(false);
        const timer = setInterval(() => {
          setCountdown(prev => {
            if (prev <= 1) {
              clearInterval(timer);
              setIsCounting(false);
              setIsSosTriggered(true);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
      };

      // Search ZIP Code (Nominatim)
      const searchZip = async (e) => {
        e.preventDefault();
        if (!zipQuery.trim()) return;
        setZipLoading(true);
        setZipFeedback('');
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(zipQuery.trim())}&format=json&limit=1`);
          const data = await res.json();
          if (data && data.length > 0) {
            const newLat = parseFloat(data[0].lat);
            const newLng = parseFloat(data[0].lon);
            const name = data[0].display_name.split(',').slice(0, 3).join(', ');
            setLocation({ lat: newLat, lng: newLng, address: `PIN ${zipQuery}: ${name}` });
            setZipFeedback(`✓ Located: ${name}`);
          } else {
            setZipFeedback(`✕ Could not find location for "${zipQuery}".`);
          }
        } catch(err) {
          setZipFeedback('✕ Search failed. Check network connection.');
        } finally {
          setZipLoading(false);
        }
      };

      // Decoy Calculator logic
      const handleCalcBtn = (char) => {
        if (char === 'C') { setCalcDisplay('0'); return; }
        if (char === '=') {
          if (calcDisplay.endsWith(masterPin)) {
            setDecoyActive(false);
            setCalcDisplay('0');
            return;
          }
          try { setCalcDisplay(String(eval(calcDisplay))); } catch(e) { setCalcDisplay('Error'); }
          return;
        }
        setCalcDisplay(prev => prev === '0' ? String(char) : prev + char);
      };

      const sosMapUrl = `https://maps.google.com/?q=${location.lat},${location.lng}`;
      const sosText = `EMERGENCY ALERT: I need immediate assistance! Track my live GPS location here: ${sosMapUrl}`;

      return (
        <div className="max-w-4xl mx-auto px-4 py-6">
          
          {/* Top Bar */}
          <header className="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-800">
            <div className="flex items-center gap-3">
              <div className="w-11 h-11 bg-rose-600 rounded-2xl flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-rose-900/40">
                🛡️
              </div>
              <div>
                <h1 className="text-xl font-extrabold tracking-tight">Narishakti-Safety</h1>
                <p className="text-xs text-rose-400 font-medium">Active Zone: {location.address}</p>
              </div>
            </div>

            {/* Quick Actions */}
            <div className="flex items-center gap-2">
              <button
                onClick={() => { sounds.startRingtone(); setFakeCallOpen(true); }}
                className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-xl border border-slate-700 transition"
              >
                📞 Fake Call
              </button>

              <button
                onClick={() => {
                  if (sirenActive) { sounds.stopSiren(); setSirenActive(false); }
                  else { sounds.startSiren(); setSirenActive(true); }
                }}
                className={`px-3.5 py-2 text-xs font-bold rounded-xl border transition ${
                  sirenActive ? 'bg-amber-500 text-black border-amber-400 animate-pulse' : 'bg-slate-800 text-slate-200 border-slate-700'
                }`}
              >
                🔊 {sirenActive ? 'Stop Siren' : 'Siren'}
              </button>

              <button
                onClick={() => setDecoyActive(true)}
                className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl border border-slate-700 transition"
                title="Press Esc to Disguise"
              >
                🧮 Disguise (Esc)
              </button>
            </div>
          </header>

          {/* Navigation Tabs */}
          <div className="flex gap-2 my-6 border-b border-slate-800/80 pb-2 overflow-x-auto">
            {[
              { id: 'home', label: '🏠 Dashboard & SOS' },
              { id: 'map', label: '🗺️ Safe Map & PIN' },
              { id: 'helplines', label: '📞 Nagpur Helplines' },
              { id: 'vault', label: '📁 Evidence Vault' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                  activeTab === tab.id ? 'bg-rose-600 text-white shadow-md' : 'bg-slate-900 text-slate-400 hover:text-slate-200'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* TAB 1: HOME & SOS LAUNCHER */}
          {activeTab === 'home' && (
            <div className="space-y-6">
              <div className="p-8 rounded-3xl bg-gradient-to-br from-slate-900 via-rose-950/40 to-slate-950 border border-rose-500/30 text-center relative overflow-hidden">
                <h2 className="text-2xl font-black text-white">One-Touch Emergency SOS</h2>
                <p className="text-xs text-slate-300 mt-2 max-w-md mx-auto">
                  Broadcasting live coordinates to your emergency contacts via WhatsApp & SMS.
                </p>

                <div className="py-10 flex justify-center">
                  <button
                    onClick={triggerSos}
                    className="w-36 h-36 rounded-full bg-gradient-to-tr from-rose-600 to-red-600 hover:scale-105 active:scale-95 text-white font-black text-2xl tracking-widest shadow-2xl sos-glow transition flex flex-col items-center justify-center border-4 border-white/20"
                  >
                    <span className="text-3xl">🚨</span>
                    <span>SOS</span>
                  </button>
                </div>
                <p className="text-xs text-rose-400 font-semibold uppercase tracking-wider">
                  Tap to Start 5-Second Countdown
                </p>
              </div>

              {/* Quick Helplines Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <a href="tel:112" className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between hover:border-slate-700">
                  <div>
                    <span className="text-xs text-slate-400 block">National Police</span>
                    <span className="text-lg font-black text-rose-400">112</span>
                  </div>
                  <span className="text-xl">🚓</span>
                </a>
                <a href="tel:1091" className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between hover:border-slate-700">
                  <div>
                    <span className="text-xs text-slate-400 block">Women Helpline</span>
                    <span className="text-lg font-black text-indigo-400">1091</span>
                  </div>
                  <span className="text-xl">👩</span>
                </a>
                <a href="tel:07122561100" className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-between hover:border-slate-700">
                  <div>
                    <span className="text-xs text-slate-400 block">Nagpur Bharosa Cell</span>
                    <span className="text-xs font-black text-emerald-400">0712-2561100</span>
                  </div>
                  <span className="text-xl">🛡️</span>
                </a>
              </div>
            </div>
          )}

          {/* TAB 2: MAP & PIN CODE */}
          {activeTab === 'map' && (
            <div className="space-y-4">
              <form onSubmit={searchZip} className="flex gap-2">
                <input
                  type="text"
                  placeholder="Enter ZIP / PIN Code (e.g. 440024, 411001, 400001)..."
                  value={zipQuery}
                  onChange={e => setZipQuery(e.target.value)}
                  className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-rose-500"
                />
                <button
                  type="submit"
                  disabled={zipLoading}
                  className="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md"
                >
                  {zipLoading ? 'Locating...' : 'Locate PIN'}
                </button>
              </form>

              {zipFeedback && (
                <div className="text-xs text-slate-300 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                  {zipFeedback}
                </div>
              )}

              <div ref={mapRef} className="h-80 w-full rounded-2xl border border-slate-800 bg-slate-900 overflow-hidden" />

              <div className="p-4 bg-slate-900 rounded-2xl border border-slate-800 text-xs space-y-2">
                <h3 className="font-bold text-white">Verified Safe Havens near {location.address}:</h3>
                <ul className="space-y-1.5 text-slate-300">
                  <li>🚓 <strong>Nagpur Police & Bharosa Cell:</strong> 112 / 0712-2561100</li>
                  <li>🏥 <strong>Civil / GMCH Mayo Hospital ER:</strong> 108</li>
                  <li>💊 <strong>24-Hour Verified Chemist:</strong> 1091</li>
                </ul>
              </div>
            </div>
          )}

          {/* TAB 3: HELPLINES */}
          {activeTab === 'helplines' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              {[
                { name: "Nagpur Police 'Bharosa Cell'", num: "0712-2561100", desc: "Specialized crisis cell for women in Nagpur" },
                { name: "Nagpur Police Control Room & Damini Squad", num: "0712-2561222", desc: "Anti-eve-teasing mobile police team" },
                { name: "National Emergency (Police/Ambulance)", num: "112", desc: "24/7 Universal emergency assistance" },
                { name: "Women's Helpline (Maharashtra)", num: "1091", desc: "Toll-free 24/7 domestic & public distress line" },
                { name: "National Cyber Crime Helpline", num: "1930", desc: "Reporting blackmail, harassment & morphing" },
                { name: "Maharashtra State Women Commission", num: "7477722424", desc: "Legal aid & grievance redressal" }
              ].map((h, i) => (
                <div key={i} className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col justify-between">
                  <div>
                    <h3 className="font-bold text-sm text-white">{h.name}</h3>
                    <p className="text-xs text-slate-400 mt-1">{h.desc}</p>
                  </div>
                  <div className="mt-4 flex items-center justify-between pt-3 border-t border-slate-800">
                    <span className="font-mono font-bold text-emerald-400">{h.num}</span>
                    <a href={`tel:${h.num.replace(/[^0-9]/g, '')}`} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold">
                      Call Now
                    </a>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* TAB 4: EVIDENCE VAULT */}
          {activeTab === 'vault' && (
            <div className="p-6 bg-slate-900 rounded-2xl border border-slate-800 space-y-4">
              <h2 className="text-base font-bold text-white">📁 Local Incident Evidence Logger</h2>
              <p className="text-xs text-slate-400">
                All records stay 100% on your device. No cloud transmission.
              </p>
              <textarea
                placeholder="Log any incident here (Date, time, description, suspect details)..."
                rows="4"
                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500"
              />
              <button
                onClick={() => alert("Incident record saved locally to your device memory.")}
                className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl"
              >
                Save Confidential Log
              </button>
            </div>
          )}

          {/* --- SOS MODAL --- */}
          {sosOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
              <div className="w-full max-w-sm bg-slate-900 border-2 border-rose-600 rounded-3xl p-6 text-center">
                {isCounting ? (
                  <div>
                    <div className="w-24 h-24 mx-auto rounded-full bg-rose-600/20 border-4 border-rose-500 flex items-center justify-center text-5xl font-black text-rose-500 animate-pulse">
                      {countdown}
                    </div>
                    <h2 className="text-xl font-bold mt-4 text-white">Alerting in {countdown}s...</h2>
                    <p className="text-xs text-slate-400 mt-1">Transmitting GPS: {location.address}</p>
                    <button
                      onClick={() => setSosOpen(false)}
                      className="mt-6 w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl border border-slate-700"
                    >
                      Cancel False Alarm
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <h2 className="text-xl font-black text-rose-500">SOS DISPATCH ACTIVE</h2>
                    <p className="text-xs text-slate-300">Live Location: {location.address}</p>
                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <a
                        href={`https://api.whatsapp.com/send?text=${encodeURIComponent(sosText)}`}
                        target="_blank"
                        className="p-3 bg-emerald-600 text-white font-bold rounded-xl text-xs flex flex-col items-center"
                      >
                        <span>💬</span> WhatsApp Alert
                      </a>
                      <a
                        href={`sms:?body=${encodeURIComponent(sosText)}`}
                        className="p-3 bg-blue-600 text-white font-bold rounded-xl text-xs flex flex-col items-center"
                      >
                        <span>📨</span> SMS Broadcast
                      </a>
                    </div>
                    <button
                      onClick={() => setSosOpen(false)}
                      className="w-full py-2 bg-slate-800 text-slate-300 text-xs font-bold rounded-xl mt-2"
                    >
                      I Am Safe (Dismiss)
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* --- FAKE CALL MODAL --- */}
          {fakeCallOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/95">
              <div className="w-full max-w-xs h-[520px] bg-slate-900 rounded-[36px] border-4 border-slate-800 p-6 flex flex-col justify-between text-center text-white">
                <div className="pt-8">
                  <div className="w-20 h-20 bg-rose-600 rounded-full mx-auto flex items-center justify-center text-3xl mb-4 animate-pulse">
                    👤
                  </div>
                  <h3 className="text-2xl font-bold">Brother</h3>
                  <p className="text-xs text-slate-400 mt-1 font-mono">+91 98220 XXXXX</p>
                  <p className="text-xs text-rose-400 font-bold uppercase mt-2">
                    {callAnswered ? `00:${String(callSecs).padStart(2,'0')}` : 'Incoming Call...'}
                  </p>
                </div>

                {callAnswered ? (
                  <button
                    onClick={() => { sounds.stopRingtone(); sounds.stopSpeech(); setFakeCallOpen(false); setCallAnswered(false); }}
                    className="w-16 h-16 bg-red-600 hover:bg-red-700 text-white rounded-full mx-auto flex items-center justify-center text-2xl shadow-lg"
                  >
                    📵
                  </button>
                ) : (
                  <div className="flex justify-around pb-6">
                    <button
                      onClick={() => { sounds.stopRingtone(); sounds.stopSpeech(); setFakeCallOpen(false); setCallAnswered(false); }}
                      className="w-16 h-16 bg-red-600 text-white rounded-full text-2xl flex items-center justify-center"
                    >
                      📵
                    </button>
                    <button
                      onClick={() => {
                        sounds.stopRingtone();
                        setCallAnswered(true);
                        sounds.speakFakeCall();
                      }}
                      className="w-16 h-16 bg-emerald-500 text-white rounded-full text-2xl flex items-center justify-center animate-bounce"
                    >
                      📞
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* --- DECOY CALCULATOR (DISGUISE) --- */}
          {decoyActive && (
            <div className="fixed inset-0 z-50 bg-black text-white flex flex-col justify-between p-6 select-none">
              <div className="text-right text-6xl font-mono pt-16 pr-2">{calcDisplay}</div>
              <div className="max-w-xs mx-auto grid grid-cols-4 gap-3 w-full pb-8">
                {['C','±','%','/', '7','8','9','*', '4','5','6','-', '1','2','3','+', '0','.','='].map((b, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleCalcBtn(b)}
                    className={`h-16 rounded-full font-bold text-xl active:scale-95 ${
                      ['/','*','-','+','='].includes(b) ? 'bg-amber-500 text-white' : 'bg-neutral-800 text-white'
                    } ${b === '0' ? 'col-span-2 text-left pl-6' : ''}`}
                  >
                    {b}
                  </button>
                ))}
              </div>
              <p className="text-center text-[11px] text-neutral-600">Type master PIN ({masterPin}) and press = to return</p>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
